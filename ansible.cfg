# Ansible configuration tuned for fan-out across the SQL Server estate.
# Picked up automatically when ansible/ansible-playbook is run from the
# repo root.

[defaults]
forks            = 50              # parallel hosts per task
host_key_checking = False
stdout_callback  = default
gathering        = smart
fact_caching     = jsonfile
fact_caching_connection = /tmp/.ansible_facts_cache
fact_caching_timeout    = 3600
internal_poll_interval  = 0.01
timeout          = 30
deprecation_warnings = False
inventory        = /etc/ansible/hosts

[ssh_connection]
# Linux targets benefit from pipelining; Windows/WinRM ignores these but
# they don't hurt.
pipelining       = True
control_path     = /tmp/.ansible-ssh-%%h-%%p-%%r
ssh_args         = -o ControlMaster=auto -o ControlPersist=10m -o PreferredAuthentications=publickey
retries          = 2

[persistent_connection]
command_timeout  = 60
connect_timeout  = 30
