# MariaDB database catalogue — one [<SCHEMA>] section per database.
#
# Regenerate / refresh from Ansible facts with:
#   python3 AI/tools/generate_mariadb_databases_ini.py
# User-owned fields (connuser, connpass, dbhost, dbport, emaillist, retention)
# are PRESERVED across re-runs; the generator only (re)writes ansible_servername,
# mariadb_instance, database, version, edition, lastupdated.
#
# The chatbot reads connuser/connpass (and dbhost/dbport) to connect via the
# mysql/mariadb client, and resolves the target host from ansible_servername.

[mariadb_servers]
mariadbhost01
mariadbhost02

[appdb]
connuser = dba
connpass =
dbhost = mariadbhost01
dbport = 3306
mariadb_instance = mariadbhost01\mariadb
database = appdb
ansible_servername = mariadbhost01
emaillist =
retention = 14
lastupdated =

[reportdb]
connuser = dba
connpass =
dbhost = mariadbhost02
dbport = 3306
mariadb_instance = mariadbhost02\mariadb
database = reportdb
ansible_servername = mariadbhost02
emaillist =
retention = 30
lastupdated =
