# PostgreSQL database catalogue — one [<DATABASE>] section per database.
#
# Regenerate / refresh from Ansible facts with:
#   python3 AI/tools/generate_pg_databases_ini.py
# User-owned fields (connuser, connpass, dbhost, dbport, emaillist, retention)
# are PRESERVED across re-runs; the generator only (re)writes ansible_servername,
# pg_instance, database, version, edition, lastupdated.
#
# The chatbot reads connuser/connpass (and dbhost/dbport) to connect via the
# psql client, and resolves the target host from ansible_servername.

[postgresql_servers]
pghost01
pghost02

[DEFAULT]
# These defaults apply to every database section that does not override them.
connuser = postgres
dbport   = 5432

[appdb]
connuser = dba
connpass =
dbhost = pghost01
dbport = 5432
pg_instance = pghost01/postgresql
database = appdb
ansible_servername = pghost01
emaillist =
retention = 14
lastupdated =

[reportdb]
connuser = dba
connpass =
dbhost = pghost02
dbport = 5432
pg_instance = pghost02/postgresql
database = reportdb
ansible_servername = pghost02
emaillist =
retention = 30
lastupdated =
