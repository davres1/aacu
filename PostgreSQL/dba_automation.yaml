---
# PostgreSQL DBA automation playbook. Mirrors MySQL/dba_automation.yaml but
# targets [postgresql_servers] in /etc/ansible/hosts and drives the psql client
# using credentials from databases.ini.
#
#   ansible-playbook -i /etc/ansible/hosts PostgreSQL/dba_automation.yaml
#   ansible-playbook -i /etc/ansible/hosts PostgreSQL/dba_automation.yaml --tags backups
#   ansible-playbook -i /etc/ansible/hosts PostgreSQL/dba_automation.yaml --tags localplugins
#
# Strategy mirrors the MySQL/Oracle/Db2/Windows side:
#   - active work (backup, amcheck/integrity, killing blockers, restarting a downed
#     service, VACUUM/REINDEX) is scheduled via cron
#   - read-only monitoring runs as CheckMK local plugins under
#     /usr/lib/check_mk_agent/local/{300,600,3600,86400}
#
# Required: databases.ini on each host (pushed here), the psql client on PATH,
# and an account with the privileges the DBA scripts use.

- hosts: "postgresql_servers:&{{ onboard_group | default('postgresql_servers') }}"
  gather_facts: true
  become: true                    # tasks need root; scripts connect with DB creds

  vars:
    repo_dir:        '/opt/dba'
    scripts_dir:     '/opt/dba/scripts'
    config_dir:      '/opt/dba'
    log_dir:         '/var/log/dba'
    status_dir:      '/var/log/dba/status'
    facts_dir:       '/etc/ansible/facts.d'
    checkmk_local:   '/usr/lib/check_mk_agent/local'
    databases_ini:   '/etc/postgresql/databases.ini'
    pg_user:         'postgres'
    pg_group:        'postgres'
    cron_user:       'root'

    backup_root:           "{{ backup_root | default('/backup/postgresql') }}"
    retention_days:        "{{ retention_days | default(14) }}"
    full_backup_time:      "{{ full_backup_time | default('22:00') }}"
    checkdb_day_of_week:   "{{ checkdb_day_of_week | default(0) }}"   # 0=Sunday
    checkdb_time:          "{{ checkdb_time | default('03:00') }}"

  tasks:
    # ===================================================================
    # 0. Directories
    # ===================================================================
    - name: Ensure DBA directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ scripts_dir }}"
        - "{{ scripts_dir }}/lib"
        - "{{ log_dir }}"
        - "{{ status_dir }}"
        - "{{ facts_dir }}"
        - "{{ checkmk_local }}"
        - "{{ checkmk_local }}/300"
        - "{{ checkmk_local }}/600"
        - "{{ checkmk_local }}/3600"
        - "{{ checkmk_local }}/86400"
        - /etc/postgresql
      tags: [always]

    - name: Ensure backup root exists (owned by postgres)
      file:
        path: "{{ backup_root }}"
        state: directory
        owner: "{{ pg_user }}"
        group: "{{ pg_group }}"
        mode: '0750'
      tags: [always]

    # ===================================================================
    # 1. Drop databases.ini onto each host (encrypt with ansible-vault).
    # ===================================================================
    - name: Push databases.ini
      copy:
        src: inventory/databases.ini
        dest: "{{ databases_ini }}"
        owner: root
        group: "{{ pg_group }}"
        mode: '0640'             # contains plaintext passwords — strict perms
      tags: [config, always]

    # ===================================================================
    # 2. Render thresholds.json from setup.yaml (PostgreSQL-flavored:
    #    tablespace / pg_cron / replication / shared_buffers / CIS PG +
    #    PG-shaped InfluxDB queries and dashboard charts).
    # ===================================================================
    - name: Render thresholds.json from setup.yaml (PostgreSQL-flavored)
      template:
        src: ../templates/pg_thresholds.json.j2
        dest: "{{ config_dir }}/thresholds.json"
        owner: root
        group: root
        mode: '0644'
      tags: [config, localplugins]

    # ===================================================================
    # 3. Push all the maintenance + monitoring scripts.
    # ===================================================================
    - name: Push shared lib
      copy:
        src: files/lib/pg_common.sh
        dest: "{{ scripts_dir }}/lib/pg_common.sh"
        owner: root
        group: root
        mode: '0755'
      tags: [scripts, always]

    - name: Push DBA scripts
      copy:
        src: "files/{{ item }}"
        dest: "{{ scripts_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - CheckPostgreSQLStatus.sh
        - DetectBlockingLocks.sh
        - BackupDatabases.sh
        - VerifyBackups.sh
        - CheckDB.sh
        - GetCheckDBStatus.sh
        - MonitorTablespaces.sh
        - MonitorJobs.sh
        - MonitorTempFiles.sh
        - SecurityAudit.sh
        - PatchLevelCheck.sh
        - MonitorReplication.sh
        - PerformanceReview.sh
        - IndexMaintenance.sh
        - createcheckmk.sh
        - db_inventory.sh
      tags: [scripts, always]

    # ===================================================================
    # 4. Ansible custom facts — expose ansible_local.db_inventory.
    # ===================================================================
    - name: Ensure Ansible facts.d directory exists
      ansible.builtin.file:
        path: "{{ facts_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: [facts, always]

    - name: Install db_inventory.sh as an Ansible custom fact
      ansible.builtin.copy:
        src: files/db_inventory.sh
        dest: "{{ facts_dir }}/db_inventory.fact"
        owner: root
        group: root
        mode: '0755'
      tags: [facts, always]

    - name: Trigger a re-gather so ansible_local.db_inventory is fresh
      ansible.builtin.setup:
        filter: ansible_local
      tags: [facts]

    # ===================================================================
    # 5. CheckMK local plugins
    # ===================================================================
    - name: Push CheckMK local plugin (default, ~60s)
      copy:
        src: files/checkmk_local/pg_local.sh
        dest: "{{ checkmk_local }}/pg_local"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (5 min)
      copy:
        src: files/checkmk_local/300/pg_tablespaces.sh
        dest: "{{ checkmk_local }}/300/pg_tablespaces"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (10 min)
      copy:
        src: files/checkmk_local/600/pg_backups_jobs.sh
        dest: "{{ checkmk_local }}/600/pg_backups_jobs"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (hourly)
      copy:
        src: files/checkmk_local/3600/pg_security_checkdb.sh
        dest: "{{ checkmk_local }}/3600/pg_security_checkdb"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (daily)
      copy:
        src: files/checkmk_local/86400/pg_patch.sh
        dest: "{{ checkmk_local }}/86400/pg_patch"
        mode: '0755'
      tags: [localplugins, checkmk]

    # ===================================================================
    # 6. Scheduled (active) work via cron.
    # ===================================================================
    - name: Cron - PostgreSQL service watchdog (hourly)
      cron:
        name: "PostgreSQL service watchdog"
        user: "{{ cron_user }}"
        minute: '0'
        job: "{{ scripts_dir }}/CheckPostgreSQLStatus.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance, remediation]

    - name: Cron - blocking-lock detector (every 30 min)
      cron:
        name: "PostgreSQL blocking detector"
        user: "{{ cron_user }}"
        minute: '*/30'
        job: "{{ scripts_dir }}/DetectBlockingLocks.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance, remediation]

    - name: Cron - security audit (every 30 min)
      cron:
        name: "PostgreSQL security audit"
        user: "{{ cron_user }}"
        minute: '15,45'
        job: "{{ scripts_dir }}/SecurityAudit.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [security, remediation]

    - name: Cron - FULL backup (daily)
      cron:
        name: "PostgreSQL FULL backup"
        user: "{{ cron_user }}"
        hour:   "{{ full_backup_time.split(':')[0] }}"
        minute: "{{ full_backup_time.split(':')[1] }}"
        job: "BACKUP_ROOT={{ backup_root }} {{ scripts_dir }}/BackupDatabases.sh Full >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - INCREMENTAL/physical base backup (every 6 hours)
      cron:
        name: "PostgreSQL INCR backup"
        user: "{{ cron_user }}"
        hour: '2,8,14,20'
        minute: '30'
        job: "BACKUP_ROOT={{ backup_root }} {{ scripts_dir }}/BackupDatabases.sh Incr >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - WAL log archive (every 15 min)
      cron:
        name: "PostgreSQL WAL archive"
        user: "{{ cron_user }}"
        minute: '*/15'
        job: "BACKUP_ROOT={{ backup_root }} {{ scripts_dir }}/BackupDatabases.sh Log >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - backup verification (daily 06:00)
      cron:
        name: "PostgreSQL backup verify"
        user: "{{ cron_user }}"
        hour:   '6'
        minute: '0'
        job: "{{ scripts_dir }}/VerifyBackups.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - amcheck integrity scan (weekly Sunday 03:00)
      cron:
        name: "PostgreSQL CheckDB"
        user: "{{ cron_user }}"
        weekday: "{{ checkdb_day_of_week }}"
        hour:    "{{ checkdb_time.split(':')[0] }}"
        minute:  "{{ checkdb_time.split(':')[1] }}"
        job: "{{ scripts_dir }}/CheckDB.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [integrity]

    - name: Cron - VACUUM/REINDEX maintenance (weekly)
      cron:
        name: "PostgreSQL index maintenance"
        user: "{{ cron_user }}"
        weekday: '6'
        hour: '4'
        minute: '0'
        job: "{{ scripts_dir }}/IndexMaintenance.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance]

    - name: Cron - temp file monitor (every 15 min)
      cron:
        name: "PostgreSQL temp file monitor"
        user: "{{ cron_user }}"
        minute: '*/15'
        job: "{{ scripts_dir }}/MonitorTempFiles.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance]

    # ===================================================================
    # 7. Cleanup: remove obsolete cron entries (superseded by CheckMK plugins)
    # ===================================================================
    - name: Remove obsolete cron entries (legacy names)
      cron:
        name: "{{ item }}"
        state: absent
      loop:
        - "PostgreSQL TablespaceMonitor"
        - "PostgreSQL PatchLevelCheck"
        - "PostgreSQL ReplicationMonitor"
        - "PostgreSQL JobsMonitor"
      tags: [cleanup]
