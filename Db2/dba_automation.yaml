---
# Db2 (LUW) DBA automation playbook. Mirrors Oracle/dba_automation.yaml but
# targets [db2_servers] in /etc/ansible/hosts and drives the db2 CLP as the
# instance owner.
#
#   ansible-playbook -i /etc/ansible/hosts Db2/dba_automation.yaml
#   ansible-playbook -i /etc/ansible/hosts Db2/dba_automation.yaml --tags backups
#   ansible-playbook -i /etc/ansible/hosts Db2/dba_automation.yaml --tags localplugins
#
# Strategy mirrors the Oracle/Windows side:
#   - active work (backup, INSPECT CHECK, forcing blockers, restarting a downed
#     instance, REORG/RUNSTATS) is scheduled via cron
#   - read-only monitoring runs as CheckMK local plugins under
#     /usr/lib/check_mk_agent/local/{300,600,3600,86400}
#
# Required: databases.ini on each host (pushed here), the db2inst1 instance
# owner must exist with ~/sqllib/db2profile.

- hosts: "db2_servers:&{{ onboard_group | default('db2_servers') }}"
  gather_facts: true
  become: true                    # most tasks need root; sudo to db2inst1 for the CLP

  vars:
    repo_dir:        '/opt/dba'
    scripts_dir:     '/opt/dba/scripts'
    config_dir:      '/opt/dba'
    log_dir:         '/var/log/dba'
    status_dir:      '/var/log/dba/status'
    facts_dir:       '/etc/ansible/facts.d'
    checkmk_local:   '/usr/lib/check_mk_agent/local'
    databases_ini:   '/etc/db2/databases.ini'
    db2_user:        'db2inst1'
    db2_group:       'db2iadm1'

    backup_root:           "{{ backup_root | default('/backup/db2') }}"
    retention_days:        "{{ retention_days | default(14) }}"
    full_backup_time:      "{{ full_backup_time | default('22:00') }}"
    checkdb_day_of_week:   "{{ checkdb_day_of_week | default(0) }}"   # 0=Sunday
    checkdb_time:          "{{ checkdb_time | default('03:00') }}"

  tasks:
    # ===================================================================
    # 0. Directories
    # ===================================================================
    - name: Ensure DBA directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ db2_user }}"
        group: "{{ db2_group }}"
        mode: '0755'
      loop:
        - "{{ scripts_dir }}"
        - "{{ scripts_dir }}/lib"
        - "{{ log_dir }}"
        - "{{ status_dir }}"
        - "{{ facts_dir }}"
        - "{{ checkmk_local }}"
        - "{{ checkmk_local }}/300"
        - "{{ checkmk_local }}/600"
        - "{{ checkmk_local }}/3600"
        - "{{ checkmk_local }}/86400"
        - /etc/db2
        - "{{ backup_root }}"
      tags: [always]

    # ===================================================================
    # 1. Drop databases.ini onto each host (encrypt with ansible-vault).
    # ===================================================================
    - name: Push databases.ini
      copy:
        src: inventory/databases.ini
        dest: "{{ databases_ini }}"
        owner: "{{ db2_user }}"
        group: "{{ db2_group }}"
        mode: '0600'             # contains plaintext passwords — strict perms
      tags: [config, always]

    # ===================================================================
    # 2. Render thresholds.json from setup.yaml (Db2-flavored:
    #    tablespace / admin_tasks / hadr / bufferpools / CIS Db2 11 +
    #    Db2-shaped InfluxDB queries and dashboard charts).
    # ===================================================================
    - name: Render thresholds.json from setup.yaml (Db2-flavored)
      template:
        src: ../templates/db2_thresholds.json.j2
        dest: "{{ config_dir }}/thresholds.json"
        owner: "{{ db2_user }}"
        group: "{{ db2_group }}"
        mode: '0644'
      tags: [config, localplugins]

    # ===================================================================
    # 3. Push all the maintenance + monitoring scripts.
    # ===================================================================
    - name: Push shared lib
      copy:
        src: files/lib/db2_common.sh
        dest: "{{ scripts_dir }}/lib/db2_common.sh"
        owner: "{{ db2_user }}"
        group: "{{ db2_group }}"
        mode: '0755'
      tags: [scripts, always]

    - name: Push DBA scripts
      copy:
        src: "files/{{ item }}"
        dest: "{{ scripts_dir }}/{{ item }}"
        owner: "{{ db2_user }}"
        group: "{{ db2_group }}"
        mode: '0755'
      loop:
        - CheckDb2Status.sh
        - DetectBlockingLocks.sh
        - BackupDatabases.sh
        - VerifyBackups.sh
        - CheckDB.sh
        - GetCheckDBStatus.sh
        - MonitorTablespaces.sh
        - MonitorJobs.sh
        - SecurityAudit.sh
        - PatchLevelCheck.sh
        - MonitorHADR.sh
        - PerformanceReview.sh
        - IndexMaintenance.sh
        - createcheckmk.sh
        - db_inventory.sh
      tags: [scripts, always]

    # ===================================================================
    # 4. Ansible custom facts — expose ansible_local.db_inventory.
    # ===================================================================
    - name: Ensure Ansible facts.d directory exists
      ansible.builtin.file:
        path: "{{ facts_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: [facts, always]

    - name: Install db_inventory.sh as an Ansible custom fact
      ansible.builtin.copy:
        src: files/db_inventory.sh
        dest: "{{ facts_dir }}/db_inventory.fact"
        owner: root
        group: root
        mode: '0755'
      tags: [facts, always]

    - name: Trigger a re-gather so ansible_local.db_inventory is fresh
      ansible.builtin.setup:
        filter: ansible_local
      tags: [facts]

    # ===================================================================
    # 5. CheckMK local plugins
    # ===================================================================
    - name: Push CheckMK local plugin (default, ~60s)
      copy:
        src: files/checkmk_local/db2_local.sh
        dest: "{{ checkmk_local }}/db2_local"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (5 min)
      copy:
        src: files/checkmk_local/300/db2_tablespaces.sh
        dest: "{{ checkmk_local }}/300/db2_tablespaces"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (10 min)
      copy:
        src: files/checkmk_local/600/db2_backups_jobs.sh
        dest: "{{ checkmk_local }}/600/db2_backups_jobs"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (hourly)
      copy:
        src: files/checkmk_local/3600/db2_security_checkdb.sh
        dest: "{{ checkmk_local }}/3600/db2_security_checkdb"
        mode: '0755'
      tags: [localplugins, checkmk]

    - name: Push CheckMK local plugin (daily)
      copy:
        src: files/checkmk_local/86400/db2_patch.sh
        dest: "{{ checkmk_local }}/86400/db2_patch"
        mode: '0755'
      tags: [localplugins, checkmk]

    # ===================================================================
    # 6. Scheduled (active) work via cron — all as the instance owner.
    # ===================================================================
    - name: Cron - Db2 service watchdog (hourly)
      cron:
        name: "Db2 service watchdog"
        user: "{{ db2_user }}"
        minute: '0'
        job: "{{ scripts_dir }}/CheckDb2Status.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance, remediation]

    - name: Cron - blocking-lock detector (every 30 min)
      cron:
        name: "Db2 blocking detector"
        user: "{{ db2_user }}"
        minute: '*/30'
        job: "{{ scripts_dir }}/DetectBlockingLocks.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance, remediation]

    - name: Cron - security audit (every 30 min)
      cron:
        name: "Db2 security audit"
        user: "{{ db2_user }}"
        minute: '15,45'
        job: "{{ scripts_dir }}/SecurityAudit.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [security, remediation]

    - name: Cron - FULL backup (daily)
      cron:
        name: "Db2 FULL backup"
        user: "{{ db2_user }}"
        hour:   "{{ full_backup_time.split(':')[0] }}"
        minute: "{{ full_backup_time.split(':')[1] }}"
        job: "BACKUP_ROOT={{ backup_root }} {{ scripts_dir }}/BackupDatabases.sh Full >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - INCREMENTAL backup (every 6 hours)
      cron:
        name: "Db2 INCR backup"
        user: "{{ db2_user }}"
        hour: '2,8,14,20'
        minute: '30'
        job: "BACKUP_ROOT={{ backup_root }} {{ scripts_dir }}/BackupDatabases.sh Incr >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - archive-log backup (every 15 min)
      cron:
        name: "Db2 LOG backup"
        user: "{{ db2_user }}"
        minute: '*/15'
        job: "BACKUP_ROOT={{ backup_root }} {{ scripts_dir }}/BackupDatabases.sh Log >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - backup verification (daily 06:00)
      cron:
        name: "Db2 backup verify"
        user: "{{ db2_user }}"
        hour:   '6'
        minute: '0'
        job: "{{ scripts_dir }}/VerifyBackups.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [backups]

    - name: Cron - INSPECT CHECK (weekly Sunday 03:00)
      cron:
        name: "Db2 CheckDB"
        user: "{{ db2_user }}"
        weekday: "{{ checkdb_day_of_week }}"
        hour:    "{{ checkdb_time.split(':')[0] }}"
        minute:  "{{ checkdb_time.split(':')[1] }}"
        job: "{{ scripts_dir }}/CheckDB.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [integrity]

    - name: Cron - index maintenance (monthly)
      cron:
        name: "Db2 index maintenance"
        user: "{{ db2_user }}"
        special_time: "monthly"
        job: "{{ scripts_dir }}/IndexMaintenance.sh >> {{ log_dir }}/cron.log 2>&1"
      tags: [maintenance]

    # ===================================================================
    # 7. Cleanup: remove obsolete cron entries (superseded by CheckMK plugins)
    # ===================================================================
    - name: Remove obsolete cron entries (legacy names)
      cron:
        name: "{{ item }}"
        state: absent
      loop:
        - "Db2 TablespaceMonitor"
        - "Db2 PatchLevelCheck"
        - "Db2 HADRMonitor"
        - "Db2 JobsMonitor"
      tags: [cleanup]
