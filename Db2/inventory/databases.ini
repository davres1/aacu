# Db2 (LUW) database catalogue — one [<DBNAME>] section per database.
#
# Regenerate / refresh from Ansible facts with:
#   python3 AI/tools/generate_db2_databases_ini.py
# User-owned fields (connuser, connpass, emaillist, retention) are PRESERVED
# across re-runs; the generator only (re)writes ansible_servername, db2_instance,
# database, version, edition, lastupdated.
#
# The chatbot reads connuser/connpass to connect via the db2 CLP, and resolves
# the target host from ansible_servername.

[db2_servers]
db2host01
db2host02

[SAMPLE]
connuser = db2inst1
connpass =
db2_instance = db2host01\db2inst1
database = SAMPLE
ansible_servername = db2host01
emaillist =
retention = 14
lastupdated =

[TRADEDB]
connuser = db2inst1
connpass =
db2_instance = db2host02\db2inst1
database = TRADEDB
ansible_servername = db2host02
emaillist =
retention = 30
lastupdated =
