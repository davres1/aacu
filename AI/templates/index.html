<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DB Info Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>DB Info Chatbot</h1>
    <span class="meta">provider: {{ provider }} &middot; model: {{ model }}</span>
  </header>

  <main>
    <div id="chat" class="chat"></div>

    <form id="composer" autocomplete="off">
      <textarea id="input" rows="2"
                placeholder="Ask about a database, e.g. 'show me databases on sqlprod01' or 'check blocking locks on sqlprod02'"></textarea>
      <button type="submit">Send</button>
    </form>

    <p class="hint">
      Examples:
      <code>list databases on sqlprod01</code>,
      <code>CPU last 24h on sqlprod02</code>,
      <code>status of MyAppDB on sqlprod01 with growth trend last 7d</code>,
      <code>grow MyAppDB datafile MyAppDB_Data by 2048 MB on sqlprod01</code>,
      <code>health check sqlprod01</code>.
    </p>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
