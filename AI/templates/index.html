<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Database Assistant</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2360a5fa'/><stop offset='100%25' stop-color='%231e40af'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><g fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='16' cy='9' rx='7' ry='2.4'/><path d='M9 9v14c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4V9'/><path d='M9 16c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4'/></g><circle cx='25' cy='7' r='2.4' fill='%23fbbf24'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- =================== SIDEBAR =================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/>
            <path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/>
            <path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">Database Assistant</div>
          <div class="brand-sub">{{ provider }} &middot; {{ model }}</div>
        </div>
      </div>

      <button id="new-chat" class="btn-new" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New chat
      </button>

      <section class="side-section">
        <div class="side-heading">Quick actions</div>
        <div class="quick-grid">
          <button class="quick" data-prompt="health check ">⚡ Health check</button>
          <button class="quick" data-prompt="list databases on ">📋 Databases</button>
          <button class="quick" data-prompt="check blocking locks on ">🔒 Blocking</button>
          <button class="quick" data-prompt="backup status on ">💾 Backups</button>
          <button class="quick" data-prompt="disk status on ">💿 Disk</button>
          <button class="quick" data-prompt="agent jobs on ">⚙️ Agent jobs</button>
          <button class="quick" data-prompt="tempdb status on ">🧪 TempDB</button>
          <button class="quick" data-prompt="security audit on ">🛡 Security</button>
          <button class="quick" data-prompt="alwayson status on ">🔄 AlwaysOn</button>
          <button class="quick" data-prompt="patch level on ">🩹 Patches</button>
        </div>
      </section>

      <section class="side-section side-history" id="history-section">
        <div class="side-heading">
          <span>Recent</span>
          <button id="clear-history" class="link-btn" type="button" title="Clear all history">Clear</button>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">No conversations yet</div>
        </div>
      </section>

      <footer class="sidebar-foot">
        <div class="status-row">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
      </footer>
    </aside>

    <!-- =================== MAIN =================== -->
    <main class="main">
      <header class="topbar">
        <button id="toggle-sidebar" class="icon-btn" type="button" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div id="chat-title" class="topbar-title">New conversation</div>
        <div class="topbar-actions">
          <label class="server-label" for="server-picker">Server</label>
          <select id="server-picker" class="server-picker" title="Loading inventory…">
            <option value="">— loading —</option>
          </select>
        </div>
      </header>

      <div id="chat" class="chat" aria-live="polite"></div>

      <form id="composer" autocomplete="off">
        <textarea id="input"
                  rows="1"
                  placeholder="Ask about your databases — e.g. health check sqlprod01, CPU last 24h on sqlprod02, blocking locks on sqlprod01"
                  spellcheck="true"></textarea>
        <button id="send-btn" type="submit" title="Send (Enter)" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </main>

  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
