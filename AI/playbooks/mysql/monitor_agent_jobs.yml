---
- name: MySQL scheduled events report
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ mysql_user | default('root') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ remote_dir }}"
        - "{{ remote_dir }}/lib"

    - name: Copy shared library
      ansible.builtin.copy:
        src: ../files/lib/mysql_common.sh
        dest: "{{ remote_dir }}/lib/mysql_common.sh"
        mode: '0755'

    - name: Copy MonitorJobs.sh
      ansible.builtin.copy:
        src: ../files/MonitorJobs.sh
        dest: "{{ remote_dir }}/MonitorJobs.sh"
        mode: '0755'

    - name: Run MonitorJobs.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/MonitorJobs.sh"
      register: result
      changed_when: false
      failed_when: false
