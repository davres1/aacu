---
# PostgreSQL performance review: queries pg_stat_statements for top queries by
# total_exec_time, reports cache hit ratios, and surfaces long-running sessions
# from pg_stat_activity.
- name: PostgreSQL performance review
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ pg_os_user | default('postgres') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir exists
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copy PerformanceReview.sh
      ansible.builtin.copy:
        src: ../files/PerformanceReview.sh
        dest: "{{ remote_dir }}/PerformanceReview.sh"
        mode: '0755'

    - name: Run PerformanceReview.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/PerformanceReview.sh"
      register: result
      changed_when: false
      failed_when: false
