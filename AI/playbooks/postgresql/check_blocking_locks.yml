---
# Detect lock waits / blockers on a PostgreSQL host using pg_stat_activity
# and pg_locks views.
- name: Detect blocking locks on a PostgreSQL host
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ pg_os_user | default('postgres') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir exists
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copy DetectBlockingLocks.sh
      ansible.builtin.copy:
        src: ../files/DetectBlockingLocks.sh
        dest: "{{ remote_dir }}/DetectBlockingLocks.sh"
        mode: '0755'

    - name: Run DetectBlockingLocks.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/DetectBlockingLocks.sh {{ only_database | default('') }}"
      register: result
      changed_when: false
      failed_when: false
