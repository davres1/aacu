---
# PostgreSQL disk / tablespace monitoring: reports pg_database_size per database
# and pg_tablespace_size per tablespace.
- name: Monitor PostgreSQL tablespace and database sizes
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ pg_os_user | default('postgres') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir exists
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copy MonitorTablespaces.sh
      ansible.builtin.copy:
        src: ../files/MonitorTablespaces.sh
        dest: "{{ remote_dir }}/MonitorTablespaces.sh"
        mode: '0755'

    - name: Run MonitorTablespaces.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/MonitorTablespaces.sh"
      register: result
      changed_when: false
      failed_when: false
