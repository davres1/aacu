---
# PostgreSQL integrity check: queries pg_catalog for corruption indicators
# and checks amcheck extension results if available.
- name: PostgreSQL integrity / catalog health check
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ pg_os_user | default('postgres') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir exists
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copy GetCheckDBStatus.sh
      ansible.builtin.copy:
        src: ../files/GetCheckDBStatus.sh
        dest: "{{ remote_dir }}/GetCheckDBStatus.sh"
        mode: '0755'

    - name: Run GetCheckDBStatus.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/GetCheckDBStatus.sh"
      register: result
      changed_when: false
      failed_when: false
