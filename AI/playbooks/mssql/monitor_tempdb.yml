---
- name: TempDB usage + contention
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    remote_dir: 'C:\Windows\Temp'

  tasks:
    - name: Copy MonitorTempDB.ps1
      ansible.windows.win_copy:
        src: "{{ scripts_dir }}/MonitorTempDB.ps1"
        dest: "{{ remote_dir }}\\MonitorTempDB.ps1"

    - name: Run MonitorTempDB.ps1
      ansible.windows.win_shell: "& '{{ remote_dir }}\\MonitorTempDB.ps1'"
      register: result
      changed_when: false
      failed_when: false
