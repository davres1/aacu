---
- name: SQL Server performance review (long-running SQL + top consumers + waits)
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    remote_dir: 'C:\Windows\Temp'

  tasks:
    - name: Copy PerformanceReview.ps1
      ansible.windows.win_copy:
        src: "{{ scripts_dir }}/PerformanceReview.ps1"
        dest: "{{ remote_dir }}\\PerformanceReview.ps1"

    - name: Run PerformanceReview.ps1
      ansible.windows.win_shell: "& '{{ remote_dir }}\\PerformanceReview.ps1'"
      register: result
      changed_when: false
      failed_when: false
