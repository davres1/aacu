---
- name: Patch / build level report
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    remote_dir: 'C:\Windows\Temp'

  tasks:
    - name: Copy PatchLevelCheck.ps1
      ansible.windows.win_copy:
        src: "{{ scripts_dir }}/PatchLevelCheck.ps1"
        dest: "{{ remote_dir }}\\PatchLevelCheck.ps1"

    - name: Run PatchLevelCheck.ps1
      ansible.windows.win_shell: "& '{{ remote_dir }}\\PatchLevelCheck.ps1'"
      register: result
      changed_when: false
      failed_when: false
