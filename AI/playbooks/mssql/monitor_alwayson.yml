---
- name: AlwaysOn Availability Group health
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    remote_dir: 'C:\Windows\Temp'

  tasks:
    - name: Copy MonitorAlwaysOn.ps1
      ansible.windows.win_copy:
        src: "{{ scripts_dir }}/MonitorAlwaysOn.ps1"
        dest: "{{ remote_dir }}\\MonitorAlwaysOn.ps1"

    - name: Run MonitorAlwaysOn.ps1
      ansible.windows.win_shell: "& '{{ remote_dir }}\\MonitorAlwaysOn.ps1'"
      register: result
      changed_when: false
      failed_when: false
