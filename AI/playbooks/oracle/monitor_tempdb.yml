---
# Oracle TEMP tablespace usage — same script as monitor_disk_space; the chat
# UI filters the result to the TEMP rows. (Kept as a separate playbook so the
# 'tempdb_status' intent works the same way as on the SQL Server side.)
- name: Oracle TEMP tablespace usage
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ oracle_user | default('oracle') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ remote_dir }}"
        - "{{ remote_dir }}/lib"

    - name: Copy shared library
      ansible.builtin.copy:
        src: ../files/lib/oracle_common.sh
        dest: "{{ remote_dir }}/lib/oracle_common.sh"
        mode: '0755'

    - name: Copy MonitorTablespaces.sh
      ansible.builtin.copy:
        src: ../files/MonitorTablespaces.sh
        dest: "{{ remote_dir }}/MonitorTablespaces.sh"
        mode: '0755'

    - name: Run MonitorTablespaces.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/MonitorTablespaces.sh"
      register: result
      changed_when: false
      failed_when: false
