---
- name: Oracle patch level report
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true                          # opatch + rpm queries need root or oracle
  become_user: "{{ oracle_user | default('oracle') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ remote_dir }}"
        - "{{ remote_dir }}/lib"

    - name: Copy shared library
      ansible.builtin.copy:
        src: ../files/lib/oracle_common.sh
        dest: "{{ remote_dir }}/lib/oracle_common.sh"
        mode: '0755'

    - name: Copy PatchLevelCheck.sh
      ansible.builtin.copy:
        src: ../files/PatchLevelCheck.sh
        dest: "{{ remote_dir }}/PatchLevelCheck.sh"
        mode: '0755'

    - name: Run PatchLevelCheck.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/PatchLevelCheck.sh"
      register: result
      changed_when: false
      failed_when: false
