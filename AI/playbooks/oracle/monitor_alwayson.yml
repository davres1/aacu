---
# Oracle Data Guard health — kept under the 'monitor_alwayson.yml' name so the
# chatbot's 'alwayson_status' intent matches both Windows and Oracle backends.
- name: Oracle Data Guard health
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  become_user: "{{ oracle_user | default('oracle') }}"

  vars:
    remote_dir: '/tmp/dba'

  tasks:
    - name: Ensure remote dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ remote_dir }}"
        - "{{ remote_dir }}/lib"

    - name: Copy shared library
      ansible.builtin.copy:
        src: ../files/lib/oracle_common.sh
        dest: "{{ remote_dir }}/lib/oracle_common.sh"
        mode: '0755'

    - name: Copy MonitorDataGuard.sh
      ansible.builtin.copy:
        src: ../files/MonitorDataGuard.sh
        dest: "{{ remote_dir }}/MonitorDataGuard.sh"
        mode: '0755'

    - name: Run MonitorDataGuard.sh
      ansible.builtin.shell: "bash {{ remote_dir }}/MonitorDataGuard.sh"
      register: result
      changed_when: false
      failed_when: false
