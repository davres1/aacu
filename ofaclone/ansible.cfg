[defaults]
inventory      = /etc/ansible/hosts
library        = /root/cfn/oracle-db-linux-prep/pipeline/ofaclone
module_utils   = /root/cfn/oracle-db-linux-prep/pipeline/ofaclone
log_path       = /tmp/ansible.log
#sudo_user      = root
#ask_sudo_pass = True
#ask_pass      = True
#transport      = smart
#remote_port    = 22
#module_lang    = C
#module_set_locale = False

gather_subset = all
roles_path    = /root/cfn/oracle-db-linux-prep/pipeline/ofaclone

executable = /bin/sh

fact_caching_connection=/tmp

[privilege_escalation]
#become=True
#become_method=sudo
#become_user=root
#become_ask_pass=False

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
