# MySQL / MariaDB database catalogue — one [<SCHEMA>] section per database.
#
# Regenerate / refresh from Ansible facts with:
#   python3 AI/tools/generate_mysql_databases_ini.py
# User-owned fields (connuser, connpass, dbhost, dbport, emaillist, retention)
# are PRESERVED across re-runs; the generator only (re)writes ansible_servername,
# mysql_instance, database, version, edition, lastupdated.
#
# The chatbot reads connuser/connpass (and dbhost/dbport) to connect via the
# mysql client, and resolves the target host from ansible_servername.

[mysql_servers]
mysqlhost01
mysqlhost02

[appdb]
connuser = dba
connpass =
dbhost = mysqlhost01
dbport = 3306
mysql_instance = mysqlhost01\mysqld
database = appdb
ansible_servername = mysqlhost01
emaillist =
retention = 14
lastupdated =

[reportdb]
connuser = dba
connpass =
dbhost = mysqlhost02
dbport = 3306
mysql_instance = mysqlhost02\mysqld
database = reportdb
ansible_servername = mysqlhost02
emaillist =
retention = 30
lastupdated =
