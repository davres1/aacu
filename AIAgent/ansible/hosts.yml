---
# =============================================================================
# DB AI Agent — Ansible Inventory
# =============================================================================
#
# HOW ANSIBLE USES THIS:
#   monitoring_servers — target for deploy_agent.yml (installs the daemon)
#   db_servers         — target for setup_db_access.yml (grants SSH + sudo access)
#
# IMPORTANT — two different SSH users are involved:
#   1. ansible_user  : your existing admin account used by Ansible during deployment
#   2. dbagent       : the service account CREATED by setup_db_access.yml;
#                      used by the agent at runtime via SSH (not by Ansible)
#
# After deployment Ansible is NOT needed on any target server.
# The agent connects to DB servers directly using SSH as dbagent.
# =============================================================================

all:
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=10"

# ---------------------------------------------------------------------------
# MONITORING SERVERS — where agent.py runs as a daemon
# Use your admin account to deploy.  deploy_agent.yml will create dbagent.
# ---------------------------------------------------------------------------
monitoring_servers:
  hosts:
    monitor-01:
      ansible_host: 10.0.1.5
      ansible_user: your_admin_user          # pre-existing admin / sudo user
      ansible_ssh_private_key_file: ~/.ssh/your_admin_key
  vars:
    agent_install_dir: /opt/AIAgent          # where the agent is installed
    agent_user: dbagent                      # service account created by Ansible
    agent_group: dbagent

# ---------------------------------------------------------------------------
# DB SERVERS — monitored via SSH by the running agent
# Use your admin account for initial setup (setup_db_access.yml).
# After setup, the agent connects as dbagent (SSH key installed by Ansible).
# ---------------------------------------------------------------------------
oracle_servers:
  hosts:
    ora-server-01:
      ansible_host: 10.0.1.10
      oracle_sid: PROD1
      oracle_home: /u01/app/oracle/product/19c/dbhome_1
    ora-server-02:
      ansible_host: 10.0.1.11
      oracle_sid: DR1
      oracle_home: /u01/app/oracle/product/19c/dbhome_1
  vars:
    ansible_user: your_admin_user            # admin account on Oracle servers
    ansible_ssh_private_key_file: ~/.ssh/your_admin_key
    db_os_group: oinstall                    # Oracle group dbagent needs to join

mysql_servers:
  hosts:
    mysql-server-01:
      ansible_host: 10.0.1.20
    mysql-server-02:
      ansible_host: 10.0.1.21
  vars:
    ansible_user: your_admin_user
    ansible_ssh_private_key_file: ~/.ssh/your_admin_key

mssql_servers:
  hosts:
    mssql-linux-01:
      ansible_host: 10.0.1.30
  vars:
    ansible_user: your_admin_user
    ansible_ssh_private_key_file: ~/.ssh/your_admin_key

db2_servers:
  hosts:
    db2-server-01:
      ansible_host: 10.0.1.40
  vars:
    ansible_user: your_admin_user
    ansible_ssh_private_key_file: ~/.ssh/your_admin_key
    db2_instance: db2inst1

postgresql_servers:
  hosts:
    pg-server-01:
      ansible_host: 10.0.1.50
    pg-server-02:
      ansible_host: 10.0.1.51
  vars:
    ansible_user: your_admin_user
    ansible_ssh_private_key_file: ~/.ssh/your_admin_key
    db_os_group: postgres                   # group dbagent needs to join

# Convenience parent group — used by setup_db_access.yml and verify_deployment.yml
db_servers:
  children:
    oracle_servers:
    mysql_servers:
    mssql_servers:
    db2_servers:
    postgresql_servers:
