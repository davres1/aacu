# =============================================================================
# ansible.cfg — DB AI Agent deployment configuration
# Run all playbooks from this ansible/ directory:
#   cd ansible/
#   ansible-playbook deploy_agent.yml
#   ansible-playbook setup_db_access.yml
#   ansible-playbook verify_deployment.yml
# =============================================================================

[defaults]
inventory         = hosts.yml
host_key_checking = False
remote_user       = root
forks             = 10
gathering         = smart
fact_caching      = jsonfile
fact_caching_connection = /tmp/.ansible_facts
fact_caching_timeout    = 3600
stdout_callback   = yaml
interpreter_python = auto_silent

# Show task timing at the end
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
# Multiplexed SSH — speeds up multiple tasks to the same host
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o BatchMode=yes
pipelining = True
